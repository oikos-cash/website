# ---- Cloudflare real client IP ----
# Trust ONLY Cloudflare edge IPs (the origin is directly reachable, so we must
# not blanket-trust) and read the real visitor IP from CF-Connecting-IP.
# Ranges: https://www.cloudflare.com/ips
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
# Requests do not arrive from Cloudflare directly: Cloudflare -> Traefik ->
# this container, so nginx's socket peer is Traefik on the internal Docker
# network (e.g. 10.0.1.4) and the CF ranges above never match. Trust the
# private ranges too, so the Cloudflare-set CF-Connecting-IP is honoured.
# Safe here because this container is only reachable through Traefik.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
# Read the client from X-Forwarded-For, walking right-to-left past every
# trusted hop (real_ip_recursive). Correct in both topologies:
#   proxied  : XFF = "client, cloudflare-edge" -> CF range trusted -> client
#   DNS-only : XFF = "client"                  -> Traefik trusted  -> client
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# ---- Structured JSON access logs (parsed cleanly by Loki/Grafana) ----
log_format json_combined escape=json '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"path":"$request_uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"host":"$host",'
    '"cf_ray":"$http_cf_ray",'
    '"cf_country":"$http_cf_ipcountry",'
    '"xff":"$http_x_forwarded_for",'
    '"peer":"$realip_remote_addr"'
'}';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout json_combined;

    # Compress text assets. Note image/gif is deliberately absent: the two
    # large hero GIFs under /assets/ are already compressed formats.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # Vite writes BOTH kinds of file into /assets/:
    #   - fingerprinted build output   (index-CUebYxRP.js, dividends-BvP8Ilzf.gif)
    #   - verbatim copies of public/assets/ (yank.png, logo.svg, bnb.png)
    # Only the first kind is safe to cache immutably. This regex matches the
    # Vite "-<8-char hash>.<ext>" suffix so the team photos and logos, which are
    # replaced in place under their existing names, stay revalidatable.
    # Keep public/assets/ filenames clear of an 8-character "-hash" suffix.
    # (quoted: nginx treats an unquoted { } in a regex as a block delimiter)
    location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css|gif|png|jpe?g|svg|webp|woff2?)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Unfingerprinted files copied from public/assets/ — cache briefly, but
    # always revalidate so replacing an image takes effect on the next load.
    location /assets/ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # Self-hosted Gilroy webfonts (public/fonts/). Filenames are stable and the
    # files never change in place, so a long cache is safe here.
    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA: unknown routes fall back to index.html (react-router handles /team,
    # /kanban, /linktree). Replaces the Netlify public/_redirects rule.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the HTML entrypoint, so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
